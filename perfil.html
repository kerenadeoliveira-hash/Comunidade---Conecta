<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF‑8">
  <title>Meu Perfil</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
<!-- Cabeçalho -->
<header>
  <div class="logo-bmc">
    <img src="logo-bmc.png" alt="Logomarca BMC" class="logo">
    <span>BMC</span>
  </div>
  <nav class="navegacao-principal">
    <a href="index.html">Início</a>
    <a href="perfil.html">Meu Perfil</a>
    <a href="servicos.html">Serviços</a>
    <a href="eventos.html">Eventos</a>
    <a href="avisos.html">Avisos</a>
    <a href="ajuda.html">Solicitar Ajuda</a>
  <div class="links-acesso">
  <a href="login.html" class="botao-acesso botao-entrar" id="botaoEntrar">Entrar</a>
  <a href="cadastro.html" class="botao-acesso botao-cadastrar" id="botaoCadastrar">Cadastrar‑se</a>
  <a href="#" class="botao-acesso botao-sair" id="botaoSair" style="display: none;">Sair</a>
</div>
</header>
</nav>
  <h1>Meu Perfil</h1>
  <div id="dadosPerfil"></div>
  <br>
  <button onclick="sairDaConta()">Sair</button>
  <br>
<a href="editar-perfil.html">Editar meus dados</a>

  <script>
    const usuario = JSON.parse(localStorage.getItem("usuarioLogado"));

    if (!usuario) {
      alert("Você precisa fazer login primeiro!");
      window.location.href = "login.html";
    } else {
      const caixa = document.getElementById("dadosPerfil");
      caixa.innerHTML = `
        <p><strong>Nome:</strong> ${usuario.nome}</p>
        <p><strong>E‑mail:</strong> ${usuario.email}</p>
        <p><strong>Telefone:</strong> ${usuario.telefone}</p> `;
    }

    function sairDaConta() {
      localStorage.removeItem("usuarioLogado");
      alert("Você saiu da conta!");
      window.location.href = "login.html";
    }
  </script>
  <footer>
  <p>Comunidade Conecta — Bem‑Estar da Minha Comunidade © 2026</p>
  <p>Feito com 💛 para o nosso bairro</p>
</footer>
  <script>
const usuarioLogado = localStorage.getItem("usuarioLogado");
const botaoEntrar = document.getElementById("botaoEntrar");
const botaoCadastrar = document.getElementById("botaoCadastrar");
const botaoSair = document.getElementById("botaoSair");

if (usuarioLogado) {
  botaoEntrar.style.display = "none";
  botaoCadastrar.style.display = "none";
  botaoSair.style.display = "block";
}

botaoSair.addEventListener("click", function() {
  localStorage.removeItem("usuarioLogado");
  window.location.href = "index.html";
});
</script>
  </header>

<div class="caixa">
  <h1>Meu Perfil</h1>
  <div id="dadosPerfil"></div>
  <br>
  <button onclick="sairDaConta()">Sair</button>
  <br>
  <a href="editar-perfil.html">Editar meus dados</a>
</div>
</body>
</html>
