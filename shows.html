<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Shows e Eventos — BMC Conecta</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', Arial, sans-serif; color: #333; background-color: #fcfcfc; }

    /* CABEÇALHO */
    header {
      background-color: #081835;
      color: #ffffff;
      padding: 14px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .logo img { height: 58px; }
    .menu-bar {
      background-color: #ffffff;
      padding: 6px 0;
      border-radius: 6px;
      flex: 1;
      margin-left: 25px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.05);
    }
    .menu-nav {
      display: flex;
      align-items: center;
      justify-content: space-around;
      flex-wrap: nowrap;
      padding: 0 12px;
    }
    .menu-nav a {
      padding: 8px 12px;
      font-size: 14px;
      color: #081835;
      text-decoration: none;
      white-space: nowrap;
      font-weight: 500;
      border-radius: 4px;
      transition: background-color 0.2s ease;
    }
    .menu-nav a:hover { background-color: rgba(8,24,53,0.08); }
    .menu-nav a.ativo {
      font-weight: bold;
      border-bottom: 2px solid #081835;
    }

    /* 🎠 CARROSSEL DE INSPIRAÇÃO */
    .hero-show {
      background: linear-gradient(135deg, #081835 0%, #1a365d 50%, #081835 100%);
      color: #ffffff;
      padding: 80px 30px 100px;
      text-align: center;
      position: relative;
      overflow: hidden;
    }
    .hero-conteudo { position: relative; z-index: 2; max-width: 900px; margin: 0 auto; min-height: 280px; }
    
    .slide {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 100%;
      opacity: 0;
      transition: opacity 1s ease-in-out;
      pointer-events: none;
    }
    .slide.ativo {
      opacity: 1;
      pointer-events: auto;
    }

    .hero-emoji { font-size: 48px; margin-bottom: 20px; }
    .hero-show h1 {
      font-size: clamp(28px, 5vw, 42px);
      line-height: 1.2;
      margin-bottom: 20px;
      letter-spacing: 1px;
    }
    .hero-show h1 span {
      background: linear-gradient(90deg, #6ed3ff, #ffffff, #6ed3ff);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }
    .hero-subtitulo {
      font-size: 18px;
      line-height: 1.8;
      opacity: 0.85;
      max-width: 700px;
      margin: 0 auto;
    }

    /* Pontinhos indicadores */
    .indicadores {
      position: absolute;
      bottom: 50px;
      left: 50%;
      transform: translateX(-50%);
      display: flex;
      gap: 12px;
      z-index: 3;
    }
    .ponto {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      background: rgba(255,255,255,0.25);
      cursor: pointer;
      transition: all 0.3s ease;
    }
    .ponto.ativo {
      background: #ffffff;
      transform: scale(1.2);
    }

    .onda {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      line-height: 0;
    }
    .onda svg { width: 100%; height: 60px; }

    /* GALERIA */
    .secao { max-width: 1400px; margin: 60px auto; padding: 0 30px; }
    .secao-titulo {
      text-align: center;
      font-size: 28px;
      color: #081835;
      margin-bottom: 10px;
    }
    .secao-linha {
      width: 100px;
      height: 4px;
      background: linear-gradient(90deg, #081835, #3469a8);
      margin: 0 auto 40px;
      border-radius: 2px;
    }
    .galeria {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 25px;
    }
    .galeria-item {
      position: relative;
      overflow: hidden;
      border-radius: 8px;
      box-shadow: 0 4px 12px rgba(8,24,53,0.12);
      aspect-ratio: 16/10;
    }
    .galeria-item img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.4s ease;
    }
    .galeria-item:hover img { transform: scale(1.05); }
    .galeria-label {
      position: absolute;
      bottom: 0; left: 0; right: 0;
      background: linear-gradient(transparent, rgba(8,24,53,0.85));
      color: white;
      padding: 30px 15px 15px;
      font-size: 15px;
      font-weight: 500;
    }

    /* RODAPÉ */
    footer {
      background-color: #081835;
      color: #ffffff;
      padding: 50px 30px;
      margin-top: 80px;
    }
    .footer-conteudo {
      max-width: 1400px;
      margin: 0 auto;
      display: grid;
      grid-template-columns: 2fr 1fr 1fr 1fr;
      gap: 40px;
    }
    .footer-logo { font-size: 22px; font-weight: bold; margin-bottom: 10px; }
    .footer-desc { font-size: 14px; opacity: 0.8; line-height: 1.6; margin-bottom: 20px; }
    .footer-redes { display: flex; gap: 12px; margin: 15px 0; }
