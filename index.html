<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bem-Estar da Minha Comunidade</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Arial, sans-serif;
        }

        body {
            background-color: #f8f9fa;
            color: #333;
            line-height: 1.6;
        }

        /* ===== CABEÇALHO ===== */
        header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            height: 70px;
            border-bottom: 1px solid #e0e0e0;
        }

        .faixa-azul {
            background-color: #1a365d;
            height: 100%;
            display: flex;
            align-items: center;
            padding: 0 25px;
            gap: 12px;
        }

        .faixa-azul img {
            height: 45px;
            width: auto;
        }

        .faixa-azul span {
            color: white;
            font-size: 1.3rem;
            font-weight: bold;
            letter-spacing: 1px;
        }

        .barra-branca {
            background-color: #ffffff;
            height: 100%;
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 40px;
        }

        .menu-central {
            display: flex;
            gap: 3.5rem;
        }

        .menu-central a {
            color: #1a365d;
            text-decoration: none;
            font-weight: 600;
            font-size: 1rem;
            transition: color 0.2s;
        }

        .menu-central a:hover {
            color: #2c5290;
            text-decoration: underline;
        }

        .menu-direito {
            display: flex;
            align-items: center;
            gap: 2rem;
        }

        .icone-perfil {
            font-size: 1.4rem;
            color: #1a365d;
            cursor: pointer;
            position: relative;
        }

        .icone-perfil:hover::after {
            content: "Meu Perfil";
            position: absolute;
            bottom: -30px;
            left: 50%;
            transform: translateX(-50%);
            background: #1a365d;
            color: white;
            padding: 5px 10px;
            border-radius: 4px;
            font-size: 0.8rem;
            white-space: nowrap;
            z-index: 100;
        }

        .sair-link {
            color: #d32f2f;
            text-decoration: none;
            font-weight: 600;
        }

        .sair-link:hover {
            color: #b71c1c;
            text-decoration: underline;
        }

        /* ===== CARROSSEL DE BANNERS ===== */
        .carrossel {
            position: relative;
            width: 100%;
            height: 380px;
            overflow: hidden;
        }

        .botao-tracos {
            position: absolute;
            top: 20px;
            left: 20px;
            background: rgba(255,255,255,0.9);
            border: none;
            padding: 10px 14px;
            font-size: 1.2rem;
            border-radius: 4px;
            cursor: pointer;
            z-index: 10;
            box-shadow: 0 2px 6px rgba(0,0,0,0.15);
        }

        .botao-tracos:hover {
            background: #ffffff;
        }

        .slides {
            display: flex;
            width: 300%;
            height: 100%;
            transform: translateX(0);
            transition: transform 0.6s ease-in-out;
        }

        .slide {
            width: 33.333%;
            height: 100%;
            position: relative;
        }

        .slide img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .texto-slide {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            text-align: center;
            color: white;
            z-index: 2;
            width: 90%;
        }

        .texto-slide h1 {
            font-size: 2.2rem;
            margin-bottom: 0.5rem;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }

        .texto-slide p {
            font-size: 1.2rem;
            text-shadow: 1px 1px 3px rgba(0,0,0,0.5);
        }

        .pontos {
            position: absolute;
            bottom: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            z-index: 3;
        }

        .ponto {
            width: 14px;
            height: 14px;
            border-radius: 50%;
            background: rgba(255,255,255,0.5);
            cursor: pointer;
            border: none;
        }

        .ponto.ativo {
            background: white;
        }

        /* ===== PAINEL DE SERVIÇOS LATERAL ===== */
        #overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0,0,0,0.4);
            z-index: 999;
            display: none;
        }

        #overlay.visivel {
            display: block;
        }

        #painelServicos {
            position: fixed;
            top: 0;
            left: -320px;
            width: 300px;
            height: 100vh;
            background: #ffffff;
            border-right: 1px solid #ddd;
            transition: left 0.3s ease;
            z-index: 1000;
            overflow-y: auto;
            padding-top: 80px;
        }

        #painelServicos.aberto {
            left: 0;
        }
