  <main>
    <div class="caixa login‑centro">
      <h2>🔒 Entrar</h2>
      <div>
        <label>E‑mail</label>
        <input type="email" id="emailLogin">
      </div>
      <div>
        <!-- Campo da senha -->
<div class="senha-container">
  <input type="password" id="senhalogin" placeholder="Digite sua senha">
  <span id="icone-olho" onclick="mostrarSenha()">👁️</span>
</div>
<script>
function mostrarSenha() {
  const campo = document.getElementById('senhalogin');
  campo.type = campo.type === 'password' ? 'text' : 'password';
}
</script>
      <button onclick="fazerLogin()">ENTRAR ✔</button>
      <p>Não tem conta? <a href="cadastro.html">Cadastre‑se</a></p>
    </div>
  </main>
<script>
function mostrarSenha() {
  const campo = document.getElementById('senhalogin');
  campo.type = campo.type === 'password' ? 'text' : 'password';
}

function fazerLogin() {
  const email = document.getElementById('emaillogin').value;
  const senha = document.getElementById('senhalogin').value;
  const usuarios = JSON.parse(localStorage.getItem('usuarios') || '[]');
  
  if (!email || !senha) {
    alert("Preencha todos os campos");
    return;
  }
  
  const usuarioEncontrado = usuarios.find(u => u.email === email && u.senha === senha);
  
  if (usuarioEncontrado) {
    localStorage.setItem('usuarioLogado', JSON.stringify(usuarioEncontrado));
    window.location.href = "perfil.html";
  } else {
    alert("E-mail ou senha incorretos");
  }
}
</script>
