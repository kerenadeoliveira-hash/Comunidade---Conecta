 <!-- Conteúdo -->
  <main>
    <div class="caixa login‑centro">
      <h2>📝 Cadastrar‑se</h2>
      <div>
        <label>Nome completo</label>
        <input type="text" id="nomeCadastro">
      </div>
      <div>
        <label>Nome:</label>label>
        <input type="text"
          Id="nomeCadastro">
      </div>
      <label>E‑mail</label>
        <input type="email" id="emailCadastro">
      </div>
      <div>
    <div class="senha-container">
  <label>Senha:</label>
  <input type="password" id="senhaCadastro" placeholder="Crie sua senha">
  <span id="icone-olho" onclick="mostrarSenhaCadastro()">👁️</span>
</div>
      <button onclick="fazerCadastro()">CADASTRAR‑SE ✔</button>
      <p>Já tem conta? <a href="login.html">Entre aqui</a></p>
    </div>
  </main>

<script>
function fazerCadastro(){
  
  const email = document.getElementById("emailCadastro").value;
  const senha = document.getElementById("senhaCadastro").value;
  const usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

  if (!email || !senha) {
    alert("Preencha todos os campos");
    return;
  }
  const jaExiste = usuarios.find(u => u.email === email);
  if (jaExiste) {
    alert("Esse e‑mail já está cadastrado");
    return;
  }
  const novoUsuario = {.mn email, senha };
  usuarios.push(novoUsuario);
  localStorage.setItem("usuarios", JSON.stringify(usuarios));
  localStorage.setItem("usuarioLogado", JSON.stringify(novoUsuario));
  window.location.href = "perfil.html";
}
function mostrarSenhaCadastro() {
  const campo = document.getElementById('senhaCadastro');
  campo.type = campo.type === 'password' ? 'text' : 'password';
}
</script>
