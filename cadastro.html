<!DOCTYPE html>
<html lang="pt‑BR">
<head>
  <meta charset="UTF‑8">
  <meta name="viewport" content="width=device‑width, initial‑scale=1.0">
  <title>Cadastrar‑se — Comunidade Conecta</title>
  <link rel="stylesheet" href="estilos.css">
</head>
<body>
  <div class="cabecalho‑titulo">
    <h2>Associação Comunidade Conecta — Projeto Bem‑Estar da Minha Comunidade © 2027</h2>
    <p>Feito para o nosso bairro</p>
  </div>

  <header>
    <div class="logo‑bmc">
      <img src="logo‑bmc.png" alt="Logomarca BMC">
      <span>BMC</span>
    </div>
    <nav class="navegacao‑principal">
      <a href="index.html">Início</a>
      <a href="servicos.html">Serviços</a>
      <a href="eventos.html">Eventos</a>
      <a href="avisos.html">Avisos</a>
      <a href="ajuda.html">Solicitar Ajuda</a>
      <div class="links‑acesso">
        <a href="login.html" class="botao‑acesso botao‑entrar">Entrar</a>
        <a href="cadastro.html" class="botao‑acesso botao‑cadastrar">Cadastrar‑se</a>
      </div>
    </nav>
  </header>

  <main>
    <div class="caixa login‑centro">
      <h2>📝 Cadastrar‑se</h2>
      <div>
        <label>Nome completo</label>
        <input type="text" id="nomeCadastro">
      </div>
      <div>
        <label>E‑mail</label>
        <input type="email" id="emailCadastro">
      </div>
      <div>
        <label>Senha</label>
        <input type="password" id="senhaCadastro">
      </div>
      <button onclick="fazerCadastro()">CADASTRAR‑SE ✔</button>
      <p>Já tem conta? <a href="login.html">Entre aqui</a></p>
    </div>
  </main>

<script>
function fazerCadastro(){
  const nome = document.getElementById("nomeCadastro").value;
  const email = document.getElementById("emailCadastro").value;
  const senha = document.getElementById("senhaCadastro").value;
  const usuarios = JSON.parse(localStorage.getItem("usuarios")) || [];

  if (!nome || !email || !senha) {
    alert("Preencha todos os campos");
    return;
  }
  const jaExiste = usuarios.find(u => u.email === email);
  if (jaExiste) {
    alert("Esse e‑mail já está cadastrado");
    return;
  }
  const novoUsuario = { nome, email, senha };
  usuarios.push(novoUsuario);
  localStorage.setItem("usuarios", JSON.stringify(usuarios));
  localStorage.setItem("usuarioLogado", JSON.stringify(novoUsuario));
  window.location.href = "perfil.html";
}
</script>
</body>
</html>
